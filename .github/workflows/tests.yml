name: tests

on:
  pull_request:
    branches:
      - "*"
  push:
    branches:
      - "master"

env:
  cache-version: "cache-v0"

jobs:
  changes:
    name: Checking changed files
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    outputs:
      keepgoing: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v46
        with:
          files: |
            *.{yml,yaml,py,toml}
            **/*.{yml,yaml,py,toml}
            container/database
            container/tests
            container/scripts/*.py
            tests
      - name: List all changed files
        run: |
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            echo "$file was changed"
          done
          echo ${{ steps.changed-files.outputs.any_changed }}
  tests:
    needs:
      - changes
    if: needs.changes.outputs.keepgoing == 'true'
    timeout-minutes: 720
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      max-parallel: 10
      matrix:
        config:
          - { python-version: "3.11", os: ubuntu-latest }
          - { python-version: "3.12", os: ubuntu-latest }
          - { python-version: "3.13", os: ubuntu-latest }
          - { python-version: "3.11", os: macos-latest }
          - { python-version: "3.12", os: macos-latest }
          - { python-version: "3.13", os: macos-latest }
          - { python-version: "3.11", os: ubuntu-latest, backend: pandas }
    runs-on: ${{ matrix.config.os }}
    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      NOT_CRAN: true
      TZ: UTC
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4

      - name: Install macOS system dependencies
        if: matrix.config.os == 'macos-latest'
        run: |
          brew install cairo pkg-config autoconf automake libtool boost gcc

      - name: Install ubuntu system dependencies
        if: matrix.config.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Setup micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: dandelion
          environment-file: environment.yml
          cache-environment: true
          cache-downloads: true
          cache-environment-key: environment-${{ env.cache-version }}-${{ matrix.config.os }}
          cache-downloads-key: downloads-${{ env.cache-version }}-${{ matrix.config.os }}
          post-cleanup: "all"
          create-args: >-
            python=${{ matrix.config.python-version }}

      - name: Install R packages (Ubuntu only)
        if: matrix.config.os == 'ubuntu-latest'
        shell: bash -l {0}
        run: |
          micromamba install -y -n dandelion -c conda-forge -c bioconda r-shazam r-alakazam r-tigger r-scoper r-optparse
          micromamba clean --all --yes

      - name: Install and test if R dependencies are installed properly
        run: |
          Rscript tests/r_dependencies.R
        continue-on-error: true

      - name: Get latest IgBlast version
        id: get_version
        shell: bash
        run: |
          IGVER=$(curl -s https://ftp.ncbi.nlm.nih.gov/blast/executables/igblast/release/ | \
                  grep -Eo 'href="[0-9]+\.[0-9]+\.[0-9]+/' | \
                  cut -d'"' -f2 | tr -d '/' | sort -V | tail -n1)
          echo "igver=$IGVER" >> $GITHUB_OUTPUT

      - name: Download and extract IgBlast
        shell: bash
        run: |
          IGVER=${{ steps.get_version.outputs.igver }}

          if [[ "${{ matrix.config.os }}" == "ubuntu-latest" ]]; then
            OSNAME="linux"
            EXT="tar.gz"
          elif [[ "${{ matrix.config.os }}" == "macos-latest" ]]; then
            OSNAME="macosx"
            EXT="tar.gz"
          fi

          FILE=ncbi-igblast-$IGVER-x64-$OSNAME.$EXT
          wget https://ftp.ncbi.nih.gov/blast/executables/igblast/release/LATEST/$FILE
          tar -xzf $FILE
          echo "PATH=$(pwd)/ncbi-igblast-$IGVER/bin:$PATH" >> $GITHUB_ENV
          rm -f $FILE

      - name: Display Python version
        run: |
          python --version
          which python

      - name: Test if blast works
        run: |
          blastn -h

      - name: Test if igblast works
        run: |
          igblastn -h

      - name: Install Dandelion
        run: |
          pip install -e ".[scirpy,scrublet,palantir,dask,polars,tests]"
          # install pertpy from github
          pip install git+https://www.github.com/scverse/pertpy.git
          # ensure filelock is installed
          pip install filelock
          # also ensure rpy2 is installed
          pip install rpy2

      - name: Test with pytest
        env:
          DANDELION_BACKEND: ${{ matrix.config.backend || 'auto' }}
        run: |
          if [ "$DANDELION_BACKEND" = "pandas" ]; then
            pytest --ignore-glob='*polars*'
          else
            pytest
          fi

      - name: Show coverage
        run: |
          coverage report

      - name: Upload coverage to Codecov
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.python-version == '3.11' && github.repository == 'tuonglab/dandelion'
        uses: codecov/codecov-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          directory: ./coverage/reports/
          env_vars: ${{ format('OS={0},PYTHON={1}', matrix.config.os, matrix.config.python-version) }}
          flags: ${{ matrix.config.backend || 'polars' }}
          name: codecov-umbrella
          fail_ci_if_error: false
          path_to_write_report: ./coverage/codecov_report.txt
          verbose: true

      - name: Upload test results to Codecov
        if: matrix.config.os == 'ubuntu-latest'
          && matrix.config.python-version == '3.11'
          && github.repository == 'tuonglab/dandelion'
          && !cancelled()
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./junit.xml
