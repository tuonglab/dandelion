name: Test Container Build

on:
  # Do the builds on all pull requests (to test them)
  pull_request:
    branches:
      - "*"

jobs:
  changes:
    name: Checking changed files
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    outputs:
      keepgoing: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v46
        with:
          files: |
            **/*.{yml,yaml,py,toml}
            .dockerignore
            container/Dockerfile
            container/database
            container/tests
            container/scripts/*.{sh,py}
            container/*.{yml,yaml,py,toml}
            src/**
            tests
          files_ignore: |
            **/container-release.yml
      - name: List all changed files
        run: |
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            echo "$file was changed"
          done
          echo ${{ steps.changed-files.outputs.any_changed }}

  container:
    needs:
      - changes
    if: needs.changes.outputs.keepgoing == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/container-build.yml
    with:
      # Like the old sc-dandelion_test.def: don't fail the PR because an
      # upstream database server is down, and try OGRDB too.
      allow_db_failure: true
      include_ogrdb: true
      push: false
