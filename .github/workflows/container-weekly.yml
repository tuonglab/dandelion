name: Weekly Test Container Build

on:
  schedule:
    # every Sunday at 0:00
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  container:
    permissions:
      contents: read
    uses: ./.github/workflows/container-build.yml
    with:
      # Same build as a release, so upstream breakages show up before release day.
      allow_db_failure: false
      include_ogrdb: false
      push: false
